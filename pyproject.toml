[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "duck-collector-imitation"
version = "0.1.0"
description = "Imitation-learning policy for a vision-based duck-collection environment."
requires-python = ">=3.10"
readme = "README.md"

[tool.setuptools.packages.find]
where = ["src"]
